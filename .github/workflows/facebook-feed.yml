# Every 2 hours: is Facebook's page plugin showing posts again? Turns the Insights fanpage feed
# on or off to match (see scripts/check-facebook-feed.mjs). Needs, in the GitHub repo settings:
#   Secrets → CRON_SECRET (same value as the Vercel env var)   Variables → SITE_URL
name: Facebook feed check

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-facebook-feed.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
